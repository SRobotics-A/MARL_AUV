# PPO configuration for the single-drone fly-forward task
# obs_dim=21, action_dim=6 (ACCBR: vx,vy,vz,roll_rate,pitch_rate,yaw_rate)
# Task: fly to a random 50m-radius goal, 360° azimuth per reset.

seed: 42


# ── Models ────────────────────────────────────────────────────────────────────
# PPO needs 2 model roles: policy (Gaussian) and value (Deterministic).
models:
  separate: True          # policy 和 value 独立 MLP
  CTDE: False             # 单智能体
  separate_actors: False
  separate_critics: False

  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -5.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: STATES
        layers: [256, 256, 128]
        activations: elu
    output: ACTIONS

  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 256, 128]
        activations: elu
    output: ONE


# ── Rollout memory ────────────────────────────────────────────────────────────
memory:
  class: RandomMemory
  memory_size: -1   # = rollouts


# ── PPO agent ─────────────────────────────────────────────────────────────────
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 32             # on-policy rollout steps per env
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95             # GAE

  learning_rate: 3.0e-4
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008

  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0

  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True

  entropy_loss_scale: 0.005
  value_loss_scale: 1.0
  kl_threshold: 0.0

  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False

  experiment:
    directory: "fly_forward"
    experiment_name: ""
    write_interval: 200
    checkpoint_interval: 10000


# ── Sequential trainer ────────────────────────────────────────────────────────
trainer:
  class: SequentialTrainer
  timesteps: 1000000
  environment_info: log
