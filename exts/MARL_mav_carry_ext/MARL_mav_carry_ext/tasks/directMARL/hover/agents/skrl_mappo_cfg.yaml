# 随机种子设置，确保实验可重现性
seed: 42


# 模型配置部分 - 使用skrl的模型实例化工具
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True # 是否使用独立的演员(actor)和评论家(critic)模型
  CTDE: True # 集中式训练分布式执行(Centralized Training with Decentralized Execution)
  separate_actors: False # 是否为每个智能体使用独立的演员模型
  separate_critics: False # 是否为每个智能体使用独立的评论家模型
  local_critics: False # 是否为每个智能体使用局部评论家
  policy:  # 策略网络配置（高斯混合模型参数）
    class: GaussianMixin  # 使用高斯分布作为动作输出
    clip_actions: False   # 是否裁剪动作输出
    clip_log_std: True    # 是否裁剪对数标准差
    min_log_std: -20.0    # 最小对数标准差
    max_log_std: 2.0      # 最大对数标准差
    initial_log_std: 0.0  # 初始对数标准差
    network:              # 神经网络结构配置
      - name: net         # 网络名称
        input: STATES     # 输入为状态
        layers: [1024, 512, 256, 128]  # 网络层结构：4层全连接网络
        activations: elu  # 激活函数：指数线性单元
    output: ACTIONS       # 输出为动作
  value:  # 价值网络配置（确定性模型参数）
    class: DeterministicMixin  # 确定性输出
    clip_actions: False        # 不裁剪动作
    network:                   # 神经网络结构
      - name: net              # 网络名称
        input: STATES          # 输入为状态
        layers: [1024, 512, 256, 128]  # 与策略网络相同的结构
        activations: elu       # 激活函数
    output: ONE                # 输出单一价值标量


# 回放缓冲区内存配置
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory      # 使用随机内存存储经验
  memory_size: -1          # 内存大小自动确定（与agent:rollouts相同）


# MAPPO智能体配置（字段名来自MAPPO_DEFAULT_CONFIG）
# https://skrl.readthedocs.io/en/latest/api/multi_agents/mappo.html
agent:
  class: MAPPO              # 使用MAPPO算法
  separate_actors: False    # 不使用独立演员模型
  use_state_space: True     # 使用状态空间
  rollouts: 128             # 回合长度（收集多少步数据后进行更新）- 越大越稳定
  learning_epochs: 5        # 学习轮数（每次更新迭代几次）- 减少可加快训练
  mini_batches: 4           # 小批量数量（将数据分成多少份进行训练）
  discount_factor: 0.99     # 折扣因子γ（未来奖励的重要性）
  lambda: 0.95              # GAE参数λ（优势函数计算中的权衡参数）
  learning_rate: 1.0e-04    # 学习率（当模型共享时使用）
  learning_rate_actor: 5.0e-05    # 演员网络学习率
  learning_rate_critic: 1.0e-04   # 评论家网络学习率
  learning_rate_scheduler_actor: null           # 演员学习率调度器（空表示不使用）
  learning_rate_scheduler_actor_kwargs: null    # 演员调度器参数
  learning_rate_scheduler_critic: null          # 评论家学习率调度器
  learning_rate_scheduler_critic_kwargs: null   # 评论家调度器参数
  # 学习率调度器示例（已注释）：
  # learning_rate_scheduler_actor: CosineAnnealingLR  # 余弦退火调度器
  # learning_rate_scheduler_actor_kwargs:
  #   T_max: 40000 # 总时间步数除以rollouts乘以learning_epochs
  #   eta_min: 1.0e-6  # 最小学习率
  # learning_rate_scheduler_critic: CosineAnnealingLR
  # learning_rate_scheduler_critic_kwargs:
  #   T_max: 40000
  #   eta_min: 1.0e-6
  state_preprocessor: RunningStandardScaler      # 状态预处理器：运行时标准化缩放器
  state_preprocessor_kwargs: null                # 状态预处理器参数
  shared_state_preprocessor: RunningStandardScaler  # 共享状态预处理器
  shared_state_preprocessor_kwargs: null         # 共享预处理器参数
  value_preprocessor: RunningStandardScaler      # 价值预处理器
  value_preprocessor_kwargs: null                # 价值预处理器参数
  random_timesteps: 0           # 随机探索时间步数（0表示不使用）
  learning_starts: 0            # 学习开始时间步数（0表示立即开始）
  grad_norm_clip: 1.0           # 梯度范数裁剪（防止梯度爆炸）
  ratio_clip: 0.1               # 比率裁剪范围（PPO的重要参数）
  value_clip: 0.1               # 价值裁剪范围
  clip_predicted_values: True   # 是否裁剪预测的价值
  entropy_loss_scale: 0.001     # 熵损失缩放因子（鼓励探索）
  value_loss_scale: 1.0         # 价值损失缩放因子
  kl_threshold: 0.0             # KL散度阈值（0表示不限制）
  rewards_shaper_scale: 1.0     # 奖励整形缩放因子
  time_limit_bootstrap: True    # 是否使用时间限制引导（处理截断回合）
  # 日志记录和检查点配置
  experiment:
    directory: "mappo_flycrane_hover"    # 实验结果保存目录
    experiment_name: "delete_me"         # 实验名称
    write_interval: 100                  # 日志写入间隔（每隔多少步记录一次）
    checkpoint_interval: 5000            # 检查点保存间隔（每隔多少步保存一次模型）


# 顺序训练器配置
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer     # 使用顺序训练器
  timesteps: 1500000           # 总训练时间步数
  environment_info: log        # 环境信息记录方式