seed: 42

models:
  separate: True
  CTDE: True
  separate_actors: False
  separate_critics: False
  local_critics: False
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -0.2  # 初始对数标准差
    network:
      - name: net
        input: STATES
        layers: [256, 256, 128]  # 网络层结构：几层全连接网络
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 256, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: MAPPO
  separate_actors: False
  use_state_space: True
  rollouts: 128
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 2.5e-4
  learning_rate_actor: 2.5e-4
  learning_rate_critic: 2.5e-4
  learning_rate_scheduler_actor: null
  learning_rate_scheduler_actor_kwargs: null
  learning_rate_scheduler_critic: null
  learning_rate_scheduler_critic_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  shared_state_preprocessor: RunningStandardScaler
  shared_state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.1
  value_clip: 0.1
  clip_predicted_values: True
  entropy_loss_scale: 0.004  # Run18：目标 std=0.65~0.70
  value_loss_scale: 1.0
  kl_threshold: 0.0
#  rewards_shaper_scale: 1.0
  time_limit_bootstrap: True
  experiment:
    directory: "move"
    experiment_name: "mappo"
    write_interval: 100
    checkpoint_interval: 5000

trainer:
  class: SequentialTrainer
  timesteps: 400000
  environment_info: log
