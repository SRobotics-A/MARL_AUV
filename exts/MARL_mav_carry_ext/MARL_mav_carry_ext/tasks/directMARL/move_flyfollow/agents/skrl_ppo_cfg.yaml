seed: 42

models:
  separate: False
  CTDE: False
  separate_actors: False
  separate_critics: False
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -0.2
    network:
      - name: net
        input: STATES
        layers: [256, 256, 128]
        activations:
        - elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 256, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 32
  learning_epochs: 5
  mini_batches: 1
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 5.0e-4
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: {"size": env.observation_space, "device": device}
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: {"size": 1, "device": device}
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.005
  value_loss_scale: 1.0
  kl_threshold: 0.0
#  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  experiment:
    directory: "move"
    experiment_name: "ppo"
    write_interval: 100
    checkpoint_interval: 2000

trainer:
  class: SequentialTrainer
  timesteps: 300000
  environment_info: log
